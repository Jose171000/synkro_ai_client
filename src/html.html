<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear cuenta nueva</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-xl shadow-lg rounded-xl overflow-hidden">
    <!-- Encabezado -->
    <div class="bg-gradient-to-r from-yellow-300 to-yellow-500 text-center py-8">
      <h1 class="text-2xl font-semibold text-gray-800">Crear una cuenta nueva</h1>
      <p class="text-sm mt-2 text-gray-700">¿Ya estás registrado? <a href="#" class="underline">Accede</a></p>
    </div>

    <!-- Formulario -->
    <form class="bg-white px-6 sm:px-10 py-8 space-y-5">
      <!-- Nombre -->
      <div>
        <label class="block text-xs text-gray-500 mb-1 uppercase">Escribe tu nombre</label>
        <input type="text" placeholder="Jimena Martínez" class="w-full px-4 py-2 rounded-full bg-gray-100 text-gray-700 focus:outline-none" />
      </div>

      <!-- Correo -->
      <div>
        <label class="block text-xs text-gray-500 mb-1 uppercase">Escribe tu correo electrónico</label>
        <input type="email" placeholder="hola@sitioincreible.mx" class="w-full px-4 py-2 rounded-full bg-gray-100 text-gray-700 focus:outline-none" />
      </div>

      <!-- Contraseña -->
      <div>
        <label class="block text-xs text-gray-500 mb-1 uppercase">Escribe tu contraseña</label>
        <input type="password" placeholder="******" class="w-full px-4 py-2 rounded-full bg-gray-100 text-gray-700 focus:outline-none" />
      </div>

      <!-- Fecha de nacimiento -->
      <div>
        <label class="block text-xs text-gray-500 mb-1 uppercase">Escribe tu fecha de nacimiento</label>
        <input type="date" class="w-full px-4 py-2 rounded-full bg-gray-100 text-gray-700 focus:outline-none" />
      </div>

      <!-- Botón -->
      <div class="flex justify-center">
        <button type="submit" class="w-full sm:w-auto bg-yellow-400 hover:bg-yellow-500 text-white px-8 py-2 rounded-full font-medium">ingresar</button>
      </div>
    </form>
  </div>

</body>
</html>
